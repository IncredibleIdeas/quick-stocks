<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Search - WhatsApp Channel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .loading-spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #4f46e5;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <header class="text-center mb-12">
            <h1 class="text-3xl md:text-4xl font-bold text-indigo-700 mb-2">Product Finder</h1>
            <p class="text-gray-600">Find products from our WhatsApp channel</p>
        </header>

        <!-- Search Section -->
        <section class="max-w-2xl mx-auto mb-12">
            <div class="bg-white rounded-lg shadow-md p-4 md:p-6">
                <div class="flex flex-col sm:flex-row">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Search for products (e.g., shoes, electronics, clothing)" 
                        class="flex-grow px-4 py-3 border border-gray-300 rounded-t-lg sm:rounded-l-lg sm:rounded-t-none focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                    <button 
                        id="searchBtn" 
                        class="bg-indigo-600 text-white px-6 py-3 rounded-b-lg sm:rounded-r-lg sm:rounded-b-none hover:bg-indigo-700 transition-colors flex items-center justify-center"
                    >
                        <i class="fas fa-search mr-2"></i> Search
                    </button>
                </div>
                <div class="mt-4 flex flex-wrap gap-2">
                    <span class="text-sm text-gray-500">Try:</span>
                    <button class="quick-search text-sm bg-gray-100 hover:bg-gray-200 px-3 py-1 rounded-full transition-colors" data-term="shoes">shoes</button>
                    <button class="quick-search text-sm bg-gray-100 hover:bg-gray-200 px-3 py-1 rounded-full transition-colors" data-term="electronics">electronics</button>
                    <button class="quick-search text-sm bg-gray-100 hover:bg-gray-200 px-3 py-1 rounded-full transition-colors" data-term="clothing">clothing</button>
                </div>
            </div>
        </section>

        <!-- Results Section -->
        <section class="max-w-6xl mx-auto">
            <div id="resultsInfo" class="mb-4 text-gray-600"></div>
            <div id="loadingIndicator" class="hidden py-8">
                <div class="loading-spinner"></div>
                <p class="text-center mt-4 text-gray-600">Loading products...</p>
            </div>
            <div id="resultsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6">
                <!-- Initial message -->
                <div class="text-center py-12 text-gray-500 col-span-full" id="initialMessage">
                    <i class="fas fa-search text-4xl mb-4"></i>
                    <p>Enter a search term to find products</p>
                </div>
            </div>
        </section>
    </div>

    <script>
        // DOM elements
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const resultsInfo = document.getElementById('resultsInfo');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const quickSearchButtons = document.querySelectorAll('.quick-search');
        const initialMessage = document.getElementById('initialMessage');

        // Global products array with fallback data
        let products = [];

        // Fallback product data in case JSON fails to load
        const fallbackProducts = [
            {
                id: 1,
                name: "Running Shoes",
                description: "Comfortable running shoes with cushioned soles for maximum comfort during workouts.",
                price: "$79.99",
                image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80",
                keywords: ["shoes", "running", "sports", "athletic"],
                whatsappLink: "https://wa.me/channel/your-channel-id?text=Running%20Shoes"
            },
            {
                id: 2,
                name: "Wireless Earbuds",
                description: "High-quality wireless earbuds with noise cancellation.",
                price: "$129.99",
                image: "https://images.unsplash.com/photo-1606220945770-b5b6c2c55bf1?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80",
                keywords: ["electronics", "earbuds", "audio", "wireless"],
                whatsappLink: "https://wa.me/channel/your-channel-id?text=Wireless%20Earbuds"
            }
        ];

        // Load products from external JSON file
        async function loadProducts() {
            try {
                console.log('Attempting to load products from products.json...');
                loadingIndicator.classList.remove('hidden');
                resultsContainer.innerHTML = '';
                
                const response = await fetch('products.json');
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('Data loaded:', data);
                
                if (data && data.products) {
                    products = data.products;
                    console.log(`Successfully loaded ${products.length} products`);
                    showSuccessMessage('Products loaded successfully!');
                } else {
                    throw new Error('Invalid JSON structure: missing products array');
                }
                
            } catch (error) {
                console.error('Error loading products:', error);
                
                // Use fallback products
                products = fallbackProducts;
                console.log(`Using ${fallbackProducts.length} fallback products`);
                showErrorMessage('Using demo products. Check console for details.');
            } finally {
                loadingIndicator.classList.add('hidden');
            }
        }

        function showSuccessMessage(message) {
            resultsInfo.innerHTML = `<div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">${message}</div>`;
            setTimeout(() => {
                resultsInfo.innerHTML = '';
            }, 3000);
        }

        function showErrorMessage(message) {
            resultsInfo.innerHTML = `<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">${message}</div>`;
        }

        // Search function
        function searchProducts(query) {
            // Clear previous results
            resultsContainer.innerHTML = '';
            resultsInfo.textContent = '';
            
            // If query is empty, show initial message
            if (!query.trim()) {
                resultsContainer.appendChild(initialMessage);
                return;
            }
            
            // Filter products based on search query
            const filteredProducts = products.filter(product => {
                const searchTerms = query.toLowerCase().split(' ');
                
                // Check if any search term matches product name, description, or keywords
                return searchTerms.some(term => 
                    product.name.toLowerCase().includes(term) ||
                    product.description.toLowerCase().includes(term) ||
                    product.keywords.some(keyword => keyword.includes(term))
                );
            });
            
            // Display results info
            resultsInfo.textContent = `Found ${filteredProducts.length} product${filteredProducts.length !== 1 ? 's' : ''} for "${query}"`;
            
            // Display results
            if (filteredProducts.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="col-span-full text-center py-12 text-gray-500">
                        <i class="fas fa-search text-4xl mb-4"></i>
                        <p>No products found for "${query}"</p>
                        <p class="text-sm mt-2">Try different keywords</p>
                    </div>
                `;
            } else {
                filteredProducts.forEach(product => {
                    const productCard = createProductCard(product);
                    resultsContainer.appendChild(productCard);
                });
            }
        }

        // Create product card element
        function createProductCard(product) {
            const card = document.createElement('div');
            card.className = 'bg-white rounded-lg shadow-md overflow-hidden';
            card.innerHTML = `
                <div class="h-48 bg-gray-200 flex items-center justify-center overflow-hidden">
                    <img src="${product.image}" alt="${product.name}" class="h-full w-full object-cover">
                </div>
                <div class="p-4">
                    <h3 class="font-semibold text-lg mb-2">${product.name}</h3>
                    <p class="text-gray-600 text-sm mb-4">${product.description}</p>
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-indigo-700">${product.price}</span>
                        <a href="${product.whatsappLink}" target="_blank" class="bg-green-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-green-600 transition-colors flex items-center">
                            <i class="fab fa-whatsapp mr-1"></i> View
                        </a>
                    </div>
                </div>
            `;
            return card;
        }

        // Event listeners
        searchBtn.addEventListener('click', () => {
            searchProducts(searchInput.value);
        });

        searchInput.addEventListener('keyup', (event) => {
            if (event.key === 'Enter') {
                searchProducts(searchInput.value);
            }
        });

        // Quick search buttons
        quickSearchButtons.forEach(button => {
            button.addEventListener('click', () => {
                const searchTerm = button.getAttribute('data-term');
                searchInput.value = searchTerm;
                searchProducts(searchTerm);
            });
        });

        // Initialize the app
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Initializing Product Finder...');
            loadProducts();
        });
    </script>
</body>
</html>
